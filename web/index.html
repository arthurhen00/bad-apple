<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Assembly Bad Apple</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <main>
      <div id="loading">
        Loading
      </div>

      <pre id="screen"></pre>

      <div id="info">
        Frame:
        <span id="frame">0</span>
        /
        <span id="total-frames">0</span>
      </div>

      <button id="play" disabled>
        PLAY
      </button>

      <div id="volume">
        Volume:
        <input
          id="volume-control"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1">
      </div>

    </main>

    <audio
      id="audio"
      src="BA.wav"
      preload="auto">
    </audio>

    <script>
      var Module = {
        onRuntimeInitialized: function () {
          initializePlayer();
        }
      };
    </script>

    <script src="player.js"></script>
    <script src="main.js"></script>
  </body>
</html>
